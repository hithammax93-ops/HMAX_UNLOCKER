<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="25%" stop-color="#e6b83b"/>
      <stop offset="50%" stop-color="#ffd768"/>
      <stop offset="75%" stop-color="#b58318"/>
      <stop offset="100%" stop-color="#fced9d"/>
    </linearGradient>

    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#996a12"/>
      <stop offset="50%" stop-color="#593b05"/>
      <stop offset="100%" stop-color="#80560d"/>
    </linearGradient>

    <!-- Blue Metallic Gradients -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0084ff"/>
      <stop offset="100%" stop-color="#003882"/>
    </linearGradient>

    <linearGradient id="blueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a36"/>
      <stop offset="50%" stop-color="#050e1f"/>
      <stop offset="100%" stop-color="#081429"/>
    </linearGradient>

    <!-- Chrome Silver Gradient -->
    <linearGradient id="silverChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="48%" stop-color="#e0e8f5"/>
      <stop offset="52%" stop-color="#8a9db8"/>
      <stop offset="100%" stop-color="#c5d3e8"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonCyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- 1. SHIELD BACKDROP -->
    <!-- Outer Gold Shield Frame -->
    <path d="M 400 60 
             L 640 140 
             L 670 410 
             C 670 540, 560 630, 400 680 
             C 240 630, 130 540, 130 410 
             L 160 140 Z" 
          fill="none" 
          stroke="url(#goldLight)" 
          stroke-width="28" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Inner Blue Shield Border -->
    <path d="M 400 85 
             L 620 160 
             L 645 405 
             C 645 520, 545 605, 400 650 
             C 255 605, 155 520, 155 405 
             L 180 160 Z" 
          fill="none" 
          stroke="url(#blueGlow)" 
          stroke-width="12" 
          stroke-linejoin="round"/>

    <!-- 2. SMARTPHONE IN CENTER -->
    <g transform="translate(290, 110)">
      <!-- Phone Shadow & Body -->
      <rect x="0" y="0" width="220" height="420" rx="42" fill="#020713" stroke="url(#goldLight)" stroke-width="8"/>
      <!-- Phone Screen -->
      <rect x="10" y="10" width="200" height="400" rx="34" fill="url(#blueDark)"/>
      
      <!-- Energy Beam inside Screen -->
      <path d="M 30 380 Q 110 200 180 30" stroke="#00d8ff" stroke-width="12" fill="none" opacity="0.6" filter="url(#neonCyanGlow)"/>
      <path d="M 40 400 Q 120 220 190 50" stroke="#ffd700" stroke-width="8" fill="none" opacity="0.7"/>

      <!-- Speaker / Dynamic Island Notch -->
      <rect x="75" y="18" width="70" height="12" rx="6" fill="#000" stroke="#1a2b4a" stroke-width="2"/>
    </g>

    <!-- 3. PLANETARY ORBITAL RINGS -->
    <!-- Cyan Energy Orbit -->
    <ellipse cx="400" cy="410" rx="340" ry="85" 
             fill="none" 
             stroke="url(#blueGlow)" 
             stroke-width="16" 
             filter="url(#neonCyanGlow)"
             transform="rotate(-18, 400, 410)"/>

    <!-- Gold Energy Orbit -->
    <ellipse cx="400" cy="410" rx="330" ry="75" 
             fill="none" 
             stroke="url(#goldLight)" 
             stroke-width="10" 
             stroke-dasharray="160 20 80 30"
             transform="rotate(14, 400, 410)"/>

    <!-- 4. OPEN GOLDEN PADLOCK -->
    <g transform="translate(325, 175)">
      <!-- Open Shackle -->
      <path d="M 60 120 L 60 70 C 60 25, 125 15, 145 55 C 158 80, 145 105, 145 105" 
            fill="none" 
            stroke="url(#goldLight)" 
            stroke-width="24" 
            stroke-linecap="round"/>
      <!-- Padlock Body -->
      <rect x="25" y="105" width="125" height="100" rx="20" fill="url(#goldLight)" stroke="url(#goldDark)" stroke-width="6"/>
      <!-- Keyhole -->
      <circle cx="87.5" cy="145" r="10" fill="#071224"/>
      <polygon points="82.5,145 92.5,145 96,175 79,175" fill="#071224"/>
    </g>

    <!-- 5. 3D EMBOSSED LETTER 'H' WITH LIGHTNING BOLT -->
    <g transform="translate(230, 360)">
      <!-- Outer 3D Extrusion Shadow -->
      <path d="M 40 180 L 120 10 L 190 10 L 160 85 L 240 85 L 265 10 L 335 10 L 255 180 L 185 180 L 210 125 L 130 125 L 110 180 Z" 
            fill="#051c3d" 
            stroke="#0084ff" 
            stroke-width="16" 
            stroke-linejoin="round"/>
      
      <!-- Golden Facet on H -->
      <path d="M 45 175 L 120 15 L 185 15 L 155 90 L 235 90 L 260 15 L 330 15 L 255 175 L 190 175 L 212 120 L 132 120 L 112 175 Z" 
            fill="url(#goldLight)"/>

      <!-- Center Lightning Energy Strike -->
      <polygon points="120,95 210,95 175,135 250,135 150,170 175,115 130,115" 
               fill="#ffffff" 
               filter="url(#neonCyanGlow)"/>
    </g>

    <!-- 6. LOWER BANNER PLAQUE: HMAX-Unlocker -->
    <g transform="translate(60, 540)">
      <!-- Plaque Outer Gold Trim -->
      <polygon points="40,55 80,10 600,10 640,55 580,115 340,165 100,115" 
               fill="url(#blueDark)" 
               stroke="url(#goldLight)" 
               stroke-width="14" 
               stroke-linejoin="round"/>

      <!-- Inner Accent Border -->
      <polygon points="55,55 90,20 590,20 625,55 570,105 340,148 110,105" 
               fill="#071733" 
               stroke="#00d4ff" 
               stroke-width="4" 
               stroke-linejoin="round"/>

      <!-- Embossed Banner Text -->
      <!-- "HMAX" in Chrome/Silver -->
      <text x="175" y="82" 
            font-family="'Cairo', 'Arial Black', sans-serif" 
            font-size="64" 
            font-weight="900" 
            font-style="italic" 
            letter-spacing="2" 
            fill="url(#silverChrome)" 
            stroke="#0a1a36" 
            stroke-width="3" 
            text-anchor="middle">HMAX</text>

      <!-- "-" Hyphen in Neon Cyan -->
      <text x="272" y="78" 
            font-family="'Cairo', 'Arial Black', sans-serif" 
            font-size="64" 
            font-weight="900" 
            fill="#00f0ff" 
            stroke="#003882" 
            stroke-width="2" 
            text-anchor="middle">-</text>

      <!-- "Unlocker" in Rich Metallic Gold -->
      <text x="435" y="82" 
            font-family="'Cairo', 'Arial Black', sans-serif" 
            font-size="62" 
            font-weight="900" 
            letter-spacing="1" 
            fill="url(#goldLight)" 
            stroke="#452a00" 
            stroke-width="4" 
            text-anchor="middle">Unlocker</text>
    </g>
  </g>
</svg>
