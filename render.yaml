services:
  - type: web
    name: hmax-unlocker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: FIREBASE_JSON_CONTENT
        sync: false
      - key: PUBLIC_URL
        sync: false
